<!doctype html>
<!-- 파일 설명: 로그인 화면 /login — 아이디 = 사번(관제 · 현장) 또는 차량번호(운전자) · 로그인하면 역할에 맞는 첫 화면으로(app/auth.py)
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 · 하역관제</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/web/auth.css">
<style>
.wrap{min-height:100vh;padding:20px 24px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.hero{background:var(--ink);color:#fff;border-radius:32px;padding:40px;display:flex;flex-direction:column;gap:24px;min-height:0}
.hero h2{font-size:40px;line-height:1.25;margin:0;letter-spacing:-.02em} .hero p{font-size:16px;color:#C9CDD1;margin:10px 0 0}
.pic{flex:1;min-height:240px;background:var(--soft-2);border-radius:24px;padding:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic img{max-width:100%;max-height:100%;object-fit:contain}
.roles{display:flex;flex-wrap:wrap;gap:8px;align-items:center} .roles .lbl{font-size:13px;color:#C9CDD1}
.card{background:#fff;border-radius:32px;padding:56px 72px;display:flex;flex-direction:column;gap:22px;justify-content:center}
.card h1{font-size:34px;margin:0} .card .sub{font-size:15px;color:var(--muted);margin:6px 0 0}
form{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;justify-content:space-between}
.row a{font-size:13px;color:var(--muted);min-height:40px;display:inline-flex;align-items:center;cursor:help}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px} .or span{flex:1;height:1px;background:#EFEFEC}
.mintro,.mfoot{display:none}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);padding:28px 20px 24px;gap:20px;align-content:start}
  .hero{display:none}
  .mintro{display:flex;flex-direction:column;gap:20px}
  .mintro .box{background:var(--ink);color:#fff;border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:14px}
  .mintro .box b{font-size:24px;line-height:1.3}
  .card{border-radius:28px;padding:22px;gap:14px} .card h1{font-size:22px} .card .sub,.or,.pcnote,.pcsign{display:none}
  .mfoot{display:flex;flex-direction:column;gap:10px} .mfoot .btn{width:100%} .mfoot span{font-size:12.5px;color:var(--muted);line-height:1.5}
}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero" aria-label="하역관제 소개">
    <div class="brandrow"><span class="logo inv" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5h11v9.5h-11z"/><path d="M13.5 9.5h4.2l3.3 3.4v3.1h-7.5z"/><circle cx="6.5" cy="17.5" r="1.9"/><circle cx="17" cy="17.5" r="1.9"/></svg></span>하역관제</div>
    <div><h2>원료 하역장의 차량·하역·안전을<br>한 화면에서</h2><p>CAM으로 위치를 보고, 호출 순번을 추천하고, 위험은 바로 알려요.</p></div>
    <div class="pic"><img src="/web/assets/map3d.png" alt="원료 하역장 3D 배치도: 호퍼 A·B·C, 차량 대기장, 계근대, 원료야드"></div>
    <div class="roles"><span class="lbl">역할별 화면</span><span class="chip dark">관제 담당자</span><span class="chip dark">현장 담당자</span><span class="chip dark">운전자</span></div>
  </section>

  <div class="mintro" aria-hidden="false">
    <div class="brandrow"><span class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5h11v9.5h-11z"/><path d="M13.5 9.5h4.2l3.3 3.4v3.1h-7.5z"/><circle cx="6.5" cy="17.5" r="1.9"/><circle cx="17" cy="17.5" r="1.9"/></svg></span>하역관제</div>
    <div class="box"><b>호출과 안전 경고를<br>휴대폰으로 받아요</b><div class="roles"><span class="chip dark">현장 담당자</span><span class="chip dark">운전자</span></div></div>
  </div>

  <section class="card" aria-labelledby="t">
    <div><h1 id="t">로그인</h1><p class="sub">사번 또는 차량번호로 로그인하세요.</p></div>
    <form id="f" novalidate>
      <label class="fld">아이디<input id="lid" name="login_id" autocomplete="username" required placeholder="사번 또는 차량번호(예: 82가 1234)"></label>
      <label class="fld">비밀번호<input id="pw" name="password" type="password" autocomplete="current-password" required></label>
      <div class="row"><label class="chk"><input type="checkbox" id="remember"><span>로그인 유지</span></label><a id="forgot" tabindex="0" title="비밀번호 찾기는 다음 라운드에서 — 지금은 관리자에게 문의">비밀번호 찾기</a></div>
      <div class="msg" id="msg" role="alert" aria-live="assertive"></div>
      <button class="btn dark" id="go" type="submit">로그인</button>
    </form>
    <div class="or"><span></span>처음이신가요?<span></span></div>
    <a class="btn pcsign" href="/signup">회원가입</a>
    <div class="note pcnote"><span>ⓘ</span><span>역할은 가입할 때 정해요. 관제 담당자는 이 관제 화면이, 현장 담당자와 운전자는 모바일 앱 화면이 열려요.</span></div>
  </section>

  <div class="mfoot"><a class="btn" href="/signup">회원가입</a><span>가입할 때 고른 역할에 맞는 화면이 열려요<br>현장 담당자는 관리자 승인 후 로그인할 수 있어요</span></div>
</main>
<script>
const $=s=>document.querySelector(s);
$('#forgot').addEventListener('click',()=>{ $('#msg').className='msg info'; $('#msg').textContent='비밀번호 찾기는 아직 준비 중이에요. 관리자에게 초기화를 요청해 주세요.'; });
const CHANGE=new URLSearchParams(location.search).get('change');
fetch('/api/me').then(r=>r.ok?r.json():null).then(u=>{ if(!u||!u.home) return; if(u.must_change_pw||CHANGE) changeForm(null,u.home); else location.replace(u.home); }).catch(()=>{});
/* 임시 비밀번호로 들어오면 새 비밀번호로 바꾸기 (R14) */
function changeForm(oldPw,home){
  const card=document.querySelector('section.card');
  card.innerHTML='<div><h1>새 비밀번호</h1><p class="sub">관리자가 비밀번호를 초기화했어요. 쓰실 비밀번호로 바꿔 주세요.</p></div>'+
    '<form id="cf" novalidate>'+(oldPw?'':'<label class="fld">지금(임시) 비밀번호<input id="cpOld" type="password" autocomplete="current-password"></label>')+
    '<label class="fld">새 비밀번호<input id="cpNew" type="password" autocomplete="new-password" placeholder="영문·숫자 8자 이상"></label>'+
    '<label class="fld">새 비밀번호 확인<input id="cpNew2" type="password" autocomplete="new-password"></label>'+
    '<div class="msg" id="cmsg" role="alert"></div><button class="btn dark" id="cgo" type="submit">바꾸고 시작하기</button></form>';
  const f=document.getElementById('cf'); f.querySelector('input').focus();
  f.addEventListener('submit',async e=>{ e.preventDefault(); const m=document.getElementById('cmsg');
    const body={old:oldPw||document.getElementById('cpOld').value,new:document.getElementById('cpNew').value,new2:document.getElementById('cpNew2').value};
    const r=await fetch('/api/auth/change_password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); const d=await r.json().catch(()=>({}));
    if(r.ok){ location.replace(d.home||home||'/'); return; } m.className='msg bad'; m.textContent=d.detail||'바꾸지 못했어요.'; });
}
let lockTimer=null;
$('#f').addEventListener('submit',async e=>{
  e.preventDefault();
  const lid=$('#lid').value.trim(), pw=$('#pw').value;
  if(!lid||!pw){ $('#msg').className='msg bad'; $('#msg').textContent='아이디와 비밀번호를 입력해 주세요.'; (lid?$('#pw'):$('#lid')).focus(); return; }
  $('#go').disabled=true;
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login_id:lid,password:pw,remember:$('#remember').checked})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){ if(d.must_change_pw){ changeForm(pw,d.home); return; } location.replace(d.home||'/'); return; }
    $('#msg').className='msg bad'; $('#msg').textContent=d.detail||'로그인하지 못했어요.'; $('#pw').value=''; $('#pw').focus();
    if(r.status===423&&d.retry_after){ let n=d.retry_after; clearInterval(lockTimer);
      lockTimer=setInterval(()=>{ n--; if(n<=0){ clearInterval(lockTimer); $('#go').disabled=false; $('#msg').className='msg info'; $('#msg').textContent='다시 로그인할 수 있어요.'; } else $('#msg').textContent='5번 틀려서 잠겼어요. '+n+'초 뒤에 다시 해 주세요.'; },1000); return; }
  }catch(err){ $('#msg').className='msg bad'; $('#msg').textContent='서버에 연결하지 못했어요.'; }
  $('#go').disabled=false;
});
</script>
</body>
</html>
